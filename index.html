<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0C0E0D">
    <meta name="description" content="Sign in to your MoneyMind personal finance space.">
    <title>MoneyMind</title>
    <link rel="icon" type="image/png" href="images/MoneyMind%20Growth%20Monogram.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="login-shell">
        <section class="form-panel" aria-labelledby="login-title">
            <header class="brand-header">
                <a class="brand" href="#" aria-label="MoneyMind home">
                    <img class="brand-logo-image" src="images/MoneyMind%20Growth%20Monogram.png" alt="MoneyMind">
                </a>
            </header>

            <div class="form-content">
                <p class="eyebrow">Your money, in focus</p>
                <h1 id="login-title">Welcome back</h1>
                <p class="intro">Welcome back to your personal finance space.</p>

                <form class="login-form" method="get">
                    <div class="field">
                        <label for="email">Email address</label>
                        <input id="email" type="email" autocomplete="email" placeholder="name@example.com">
                    </div>

                    <div class="field">
                        <label for="password">Password</label>
                        <input id="password" type="password" autocomplete="current-password" placeholder="Enter your password">
                    </div>

                    <div class="form-options">
                        <label class="remember-option" for="remember">
                            <input id="remember" type="checkbox">
                            <span>Remember Me</span>
                        </label>
                        <a class="text-link" href="#">Forgot Password?</a>
                    </div>

                    <button class="sign-in-button" type="submit">Sign In <span aria-hidden="true">→</span></button>
                </form>

                <p class="signup-prompt">Don't have an account? <a class="text-link" href="#">Sign Up</a></p>
            </div>

        </section>

        <aside class="visual-panel" aria-label="MoneyMind personal finance illustration">
            <div class="visual-heading" aria-hidden="true">
                <span class="visual-rule"></span>
                <span>Clarity for every next step</span>
                <span class="visual-index">01 / 01</span>
            </div>
            <img class="finance-illustration"
                src="images/MoneyMind%20side_image.png"
                alt="A person using MoneyMind to plan and track their finances">
            <p class="visual-caption">Track. Plan. Grow.</p>
        </aside>
    </main>
    <script src="./js/script.js"></script>
</body>
</html>
